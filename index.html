<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Тихая Деревня — вечерняя прогулка</title>
  <link rel="stylesheet" href="css/village.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>

  <div id="loading">
    <div class="loading-inner">
      <div class="lamp"></div>
      <h1>Тихая Деревня</h1>
      <p id="loading-status">Разжигаем фонари…</p>
      <div class="bar"><i id="loading-bar"></i></div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="panel panel-place" id="place-panel">
      <div class="place-name" id="place-name">Центральная площадь</div>
      <div class="place-sub" id="place-sub">Тихо пахнет дымом и яблоками</div>
    </div>

    <div class="panel panel-top-right">
      <div class="clock" id="clock">19:40</div>
      <div class="phase" id="phase">Сумерки</div>
      <input id="time-slider" type="range" min="0" max="24" step="0.01" value="19.6" aria-label="Время суток">
      <div class="presets">
        <button data-time="7.5">Утро</button>
        <button data-time="13">День</button>
        <button data-time="19.6" class="active">Сумерки</button>
        <button data-time="23">Ночь</button>
      </div>
      <div class="weather-row">
        <span class="weather-label">Погода</span>
        <div class="weather-btns">
          <button data-weather="clear" class="active" title="Ясно">☀</button>
          <button data-weather="rain" title="Дождь">☂</button>
          <button data-weather="fog" title="Туман">≋</button>
        </div>
      </div>
    </div>

    <div class="panel panel-bottom-left">
      <div class="keys">
        <span><b>W A S D</b> идти</span>
        <span><b>Shift</b> бежать</span>
        <span><b>Мышь</b> осмотреться</span>
        <span><b>Колесо</b> приблизить</span>
        <span><b>E</b> поговорить</span>
        <span><b>F</b> фонарь</span>
        <span><b>P</b> скрыть интерфейс</span>
      </div>
      <div class="toggles">
        <button id="btn-bloom" class="active">Свечение</button>
        <button id="btn-shuffle" class="active">Светлячки</button>
        <button id="btn-sound">Звук</button>
        <button id="btn-photo">Снимок</button>
      </div>
    </div>

    <div class="panel panel-bottom-right" id="stat-panel">
      <div><span id="stat-people">0</span> жителей рядом</div>
      <div><span id="stat-houses">0</span> домиков в деревне</div>
    </div>

    <div id="bubble" class="bubble hidden"><p id="bubble-text"></p><span id="bubble-name"></span></div>
    <div id="toast" class="toast hidden"></div>

    <div id="prompt" class="prompt hidden"><b>E</b> <span id="prompt-text">Поговорить</span></div>
  </div>

  <script type="module" src="js/village/main.js"></script>
</body>
</html>
